name: Model or reference request
description: Ask for a model for another amplicon region or reference database (for example SILVA or RDP).
labels: ["model request"]
body:
  - type: input
    id: region
    attributes:
      label: Amplicon region
      description: For example V4 (515F/806R), V3-V4 (341F/805R), V1-V3, full-length 16S, ITS.
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: Reference database and version
      placeholder: SILVA 138.2, RDP 19, Greengenes2 2024.09, GTDB R220
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: What you would use it for
      description: Sample type and sequencing platform help us decide what to train first.
