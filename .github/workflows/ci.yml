name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU-only PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install taxonova with test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run tests
        # Tests marked "models" need the released checkpoints and are skipped
        # here; they run where the checkpoints are available (see docs/releasing.md).
        run: python -m pytest -q
      - name: Command line smoke test
        run: |
          taxonova --version
          taxonova models
          taxonova classify --help

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and check the distribution
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
