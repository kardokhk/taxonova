name: release

# Runs when a version tag (v26.10.1, v26.11.0, ...) is pushed. Builds the
# wheel and sdist, attaches them to the GitHub release and publishes them to
# PyPI through Trusted Publishing (no token is stored in the repository).
# One-time setup on pypi.org is described in docs/releasing.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
          (cd dist && sha256sum * > SHA256SUMS.dist)
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Attach the distribution to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release may already exist (created by hand with the model files);
          # create it only if it does not, then upload or replace the dist files.
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
              --title "taxonova ${GITHUB_REF_NAME#v}" --notes "See CHANGELOG.md."
          gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/taxonova/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Keep only the wheel and sdist
        run: rm -f dist/SHA256SUMS.dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A version already uploaded by hand is left as it is.
          skip-existing: true
