[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taxonova"
version = "26.10.3"
description = "Taxonomic classification of 16S rRNA and rRNA operon amplicon sequences with confidence-aware deep learning models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kardokh Kakabra", email = "kardokhkaka@gmail.com" }]
keywords = ["bioinformatics", "taxonomy", "classification", "deep-learning", "amplicon", "16S", "rRNA", "microbiome", "metagenomics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=1.10.0",
    "numpy>=1.19.2",
    "pandas>=1.2.3",
    "scikit-learn>=0.24.1",
    "tqdm>=4.59.0",
    "psutil>=5.8.0",
    "setproctitle>=1.3.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/kardokhk/taxonova"
Documentation = "https://github.com/kardokhk/taxonova/tree/main/docs"
Changelog = "https://github.com/kardokhk/taxonova/blob/main/CHANGELOG.md"
Paper = "https://doi.org/10.1371/journal.pcbi.1014912"
"Web app" = "https://huggingface.co/spaces/claessonlab/Taxonova"
Issues = "https://github.com/kardokhk/taxonova/issues"

[project.scripts]
taxonova = "taxonova.main:main"
taxonova-setup = "taxonova.utils.model_downloader:post_install_setup"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["taxonova*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: needs the released model checkpoints (skipped if absent)"]
